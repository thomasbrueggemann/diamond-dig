<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond Dig</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
body { overflow: hidden; background: #1a0a2e; font-family: 'Segoe UI', Tahoma, sans-serif; }
canvas { display: block; }

#ui {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 20px;
  z-index: 10;
}

.stat {
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,215,0,0.3);
  border-radius: 12px;
  padding: 10px 20px;
  color: #fff;
  text-align: center;
  min-width: 90px;
}

#timer-bar-container {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 6px;
  background: rgba(0,0,0,0.5);
  z-index: 10;
}

#timer-bar {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, #00e5ff, #ffd700);
  transition: width 0.5s linear, background 0.5s;
  border-radius: 0 3px 3px 0;
}

#timer-bar.urgent {
  background: linear-gradient(90deg, #ff4444, #ff8800);
  animation: pulse-bar 0.5s ease-in-out infinite;
}

@keyframes pulse-bar {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

#timer-warning {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: 5;
  opacity: 0;
  transition: opacity 0.3s;
}

#timer-warning.show {
  opacity: 1;
  animation: warning-flash 0.5s ease-in-out infinite;
}

@keyframes warning-flash {
  0%, 100% { box-shadow: inset 0 0 60px rgba(255,0,0,0.3); }
  50% { box-shadow: inset 0 0 120px rgba(255,0,0,0.6); }
}

.stat .label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: rgba(255,255,255,0.6);
  margin-bottom: 4px;
}

.stat .value {
  font-size: 26px;
  font-weight: bold;
  color: #ffd700;
}

.stat .value.diamonds { color: #00e5ff; }
.stat .value.digs { color: #ff6b6b; }

#hint-btn {
  position: absolute;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(100, 50, 200, 0.7);
  border: 1px solid rgba(150, 100, 255, 0.5);
  border-radius: 14px;
  padding: 14px 28px;
  color: #d4b0ff;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  z-index: 10;
  transition: all 0.2s;
  min-height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
}

#hint-btn:hover {
  background: rgba(130, 70, 230, 0.8);
  border-color: rgba(180, 130, 255, 0.7);
  color: #fff;
}

#hint-btn:active {
  transform: translateX(-50%) scale(0.95);
}

#hint-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

#proximity-info {
  position: absolute;
  top: 125px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.7);
  border-radius: 14px;
  padding: 12px 24px;
  color: #fff;
  font-size: 15px;
  z-index: 10;
  opacity: 0;
  transition: opacity 0.2s;
  text-align: center;
  max-width: 90vw;
  user-select: none;
  -webkit-user-select: none;
}

#proximity-info.show { opacity: 1; }
#proximity-info .dist { font-weight: bold; font-size: 20px; }

#message {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 48px;
  font-weight: bold;
  color: #ffd700;
  text-shadow: 0 0 30px rgba(255,215,0,0.8), 0 0 60px rgba(255,215,0,0.4);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
  z-index: 10;
}

#message.show { opacity: 1; }
#message.miss { color: #ff6b6b; text-shadow: 0 0 30px rgba(255,107,107,0.8); }

#instructions {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255,255,255,0.5);
  font-size: 14px;
  z-index: 10;
}

#start-screen, #end-screen {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(10,5,30,0.95);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
}

#start-screen h1, #end-screen h1 {
  font-size: 72px;
  color: #ffd700;
  text-shadow: 0 0 40px rgba(255,215,0,0.6);
  margin-bottom: 10px;
}

#start-screen .subtitle, #end-screen .subtitle {
  font-size: 18px;
  color: rgba(255,255,255,0.5);
  margin-bottom: 40px;
}

#end-screen .stats {
  display: flex;
  gap: 40px;
  margin-bottom: 40px;
}

#end-screen .stat-item {
  text-align: center;
  color: #fff;
}

#end-screen .stat-item .val {
  font-size: 36px;
  font-weight: bold;
  color: #ffd700;
}

#end-screen .stat-item .lbl {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: rgba(255,255,255,0.5);
}

#start-btn, #restart-btn {
  background: linear-gradient(135deg, #ffd700, #ff8c00);
  border: none;
  border-radius: 50px;
  padding: 18px 64px;
  font-size: 22px;
  font-weight: bold;
  color: #1a0a2e;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 0 30px rgba(255,215,0,0.4);
  min-height: 56px;
  min-width: 200px;
}

#start-btn:hover, #restart-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 50px rgba(255,215,0,0.6);
}

#start-btn:active, #restart-btn:active {
  transform: scale(0.97);
}

.hidden { display: none !important; }
</style>
</head>
<body>

<div id="ui">
  <div class="stat">
    <div class="label">Diamonds</div>
    <div class="value diamonds" id="diamond-count">0</div>
  </div>
  <div class="stat">
    <div class="label">Digs Left</div>
    <div class="value digs" id="digs-left">30</div>
  </div>
  <div class="stat">
    <div class="label">Time</div>
    <div class="value" id="timer-display">90</div>
  </div>
  <div class="stat">
    <div class="label">Score</div>
    <div class="value" id="score">0</div>
  </div>
</div>

<div id="timer-bar-container"><div id="timer-bar"></div></div>
<div id="timer-warning"></div>

<button id="hint-btn" disabled>🔮 Hint (50 pts)</button>
<div id="proximity-info"></div>

<div id="message"></div>
<div id="instructions">Click on the ground to dig for diamonds!</div>

<div id="start-screen">
  <h1>💎 Diamond Dig</h1>
  <div class="subtitle">Use proximity clues and hints to find 8 hidden diamonds — 90 seconds on the clock!</div>
  <button id="start-btn">Start Digging</button>
</div>

<div id="end-screen" class="hidden">
  <h1 id="end-title">Game Over</h1>
  <div class="subtitle" id="end-subtitle">Here are your results</div>
  <div class="stats">
    <div class="stat-item">
      <div class="val" id="end-diamonds">0</div>
      <div class="lbl">Diamonds</div>
    </div>
    <div class="stat-item">
      <div class="val" id="end-score">0</div>
      <div class="lbl">Score</div>
    </div>
    <div class="stat-item">
      <div class="val" id="end-accuracy">0%</div>
      <div class="lbl">Accuracy</div>
    </div>
    <div class="stat-item">
      <div class="val" id="end-time">0s</div>
      <div class="lbl">Time Left</div>
    </div>
  </div>
  <button id="restart-btn">Dig Again</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// --- Game Config ---
const GRID_SIZE = 10;
const CELL_SIZE = 2;
const TOTAL_CELLS = GRID_SIZE * GRID_SIZE;
const DIAMOND_COUNT = 8;
const MAX_DIGS = 30;
const HINT_COST = 50;
const GAME_TIME = 90; // seconds

// --- Game State ---
let diamondsFound = 0;
let digsMade = 0;
let digsRemaining = MAX_DIGS;
let score = 0;
let gameStarted = false;
let grid = []; // 0 = empty, 1 = diamond
let dugCells = new Set();
let holeMeshes = [];
let particleSystems = [];

let hintArrow = null;
let hintActive = false;
let hintArrowTarget = null;

// --- Timer ---
let timeRemaining = GAME_TIME;
let timeElapsed = 0;
let timerInterval = null;

// --- Three.js Setup ---
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x1a0a2e, 0.015);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 18, 14);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x1a0a2e);
document.body.appendChild(renderer.domElement);

// --- Lighting ---
const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffeedd, 1.0);
dirLight.position.set(10, 20, 10);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.camera.left = -15;
dirLight.shadow.camera.right = 15;
dirLight.shadow.camera.top = 15;
dirLight.shadow.camera.bottom = -15;
scene.add(dirLight);

const pointLight = new THREE.PointLight(0xffd700, 0.5, 30);
pointLight.position.set(0, 10, 0);
scene.add(pointLight);

// --- Materials ---
const grassMat = new THREE.MeshStandardMaterial({
  color: 0x2d5a1e,
  roughness: 0.9,
  metalness: 0.0,
});

const dirtMat = new THREE.MeshStandardMaterial({
  color: 0x5c3a1e,
  roughness: 1.0,
  metalness: 0.0,
});

const deepDirtMat = new THREE.MeshStandardMaterial({
  color: 0x3a2510,
  roughness: 1.0,
  metalness: 0.0,
});

// --- Ground Plane ---
const groundGeo = new THREE.PlaneGeometry(GRID_SIZE * CELL_SIZE + 2, GRID_SIZE * CELL_SIZE + 2);
const ground = new THREE.Mesh(groundGeo, grassMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.01;
ground.receiveShadow = true;
scene.add(ground);

// --- Grid Setup ---
function initGrid() {
  grid = new Array(TOTAL_CELLS).fill(0);
  let placed = 0;
  while (placed < DIAMOND_COUNT) {
    const idx = Math.floor(Math.random() * TOTAL_CELLS);
    if (grid[idx] === 0) {
      grid[idx] = 1;
      placed++;
    }
  }
  console.log('Diamonds placed at:', grid.map((v, i) => v === 1 ? i : -1).filter(i => i >= 0));
}

function cellToPosition(cellIdx) {
  const row = Math.floor(cellIdx / GRID_SIZE);
  const col = cellIdx % GRID_SIZE;
  const x = (col - (GRID_SIZE - 1) / 2) * CELL_SIZE;
  const z = (row - (GRID_SIZE - 1) / 2) * CELL_SIZE;
  return { x, z };
}

// --- Proximity / Heat ---
function getDistanceToNearestDiamond(cellIdx) {
  const row = Math.floor(cellIdx / GRID_SIZE);
  const col = cellIdx % GRID_SIZE;
  let minDist = Infinity;
  for (let i = 0; i < TOTAL_CELLS; i++) {
    if (grid[i] === 1) {
      const dRow = Math.floor(i / GRID_SIZE) - row;
      const dCol = (i % GRID_SIZE) - col;
      const dist = Math.sqrt(dRow * dRow + dCol * dCol);
      if (dist < minDist) minDist = dist;
    }
  }
  return minDist;
}

function proximityColor(dist) {
  // dist 0 = on top of diamond (red), dist ~4.2 = max distance (blue)
  const maxDist = Math.sqrt(2) * (GRID_SIZE - 1); // ~12.7
  const t = Math.min(dist / (maxDist * 0.5), 1); // normalize
  // Red (close) -> Yellow -> Green -> Blue (far)
  if (t < 0.25) return { r: 255, g: Math.floor(t * 4 * 255), b: 0 }; // red to yellow
  if (t < 0.5) return { r: Math.floor(255 - (t - 0.25) * 4 * 255), g: 255, b: 0 }; // yellow to green
  return { r: 0, g: Math.floor(255 - (t - 0.5) * 4 * 255), b: Math.floor((t - 0.5) * 4 * 255) }; // green to blue
}

function proximityLabel(dist) {
  if (dist === 0) return { text: '💎 RIGHT ON TOP!', color: '#ff4444' };
  if (dist <= 1) return { text: '🔥 Very Close!', color: '#ff8800' };
  if (dist <= 2) return { text: '👍 Close', color: '#ffcc00' };
  if (dist <= 3) return { text: '👌 Somewhat Near', color: '#88cc00' };
  if (dist <= 4) return { text: '🤷 Getting Far', color: '#0088cc' };
  return { text: '❄️ Very Far', color: '#0044aa' };
}

// --- Diamond Mesh ---
function createDiamond(x, y, z) {
  const group = new THREE.Group();

  const geo = new THREE.OctahedronGeometry(0.3, 0);
  const mat = new THREE.MeshStandardMaterial({
    color: 0x00e5ff,
    emissive: 0x004466,
    emissiveIntensity: 0.5,
    roughness: 0.1,
    metalness: 0.3,
    transparent: true,
    opacity: 0.9,
  });
  const diamond = new THREE.Mesh(geo, mat);
  diamond.castShadow = true;
  group.add(diamond);

  const glowGeo = new THREE.SphereGeometry(0.5, 16, 16);
  const glowMat = new THREE.MeshBasicMaterial({
    color: 0x00e5ff,
    transparent: true,
    opacity: 0.15,
  });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  group.add(glow);

  const light = new THREE.PointLight(0x00e5ff, 1, 5);
  group.add(light);

  group.position.set(x, y, z);
  group.visible = false;
  scene.add(group);
  return group;
}

// --- Particles ---
function createDigParticles(x, z, isDiamond) {
  const count = isDiamond ? 40 : 20;
  const color = isDiamond ? 0x00e5ff : 0x5c3a1e;
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  const velocities = [];

  for (let i = 0; i < count; i++) {
    positions[i * 3] = x;
    positions[i * 3 + 1] = 0.2;
    positions[i * 3 + 2] = z;
    velocities.push({
      x: (Math.random() - 0.5) * 0.3,
      y: Math.random() * 0.2 + 0.1,
      z: (Math.random() - 0.5) * 0.3,
    });
  }

  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

  const mat = new THREE.PointsMaterial({
    color: color,
    size: 0.15,
    transparent: true,
    opacity: 1,
    sizeAttenuation: true,
  });

  const points = new THREE.Points(geo, mat);
  scene.add(points);

  particleSystems.push({
    points,
    velocities,
    life: 1.0,
    decay: 0.02,
  });
}

// --- Create Hint Arrow ---
function createHintArrow(targetCellIdx) {
  const targetPos = cellToPosition(targetCellIdx);
  const cameraDir = new THREE.Vector3();
  camera.getWorldDirection(cameraDir);

  // Position arrow at edge of visible area pointing toward diamond
  const arrowLen = 2;
  const arrowGeo = new THREE.ConeGeometry(0.3, arrowLen, 8);
  const arrowMat = new THREE.MeshBasicMaterial({
    color: 0x00e5ff,
    transparent: true,
    opacity: 0.8,
  });
  const arrow = new THREE.Mesh(arrowGeo, arrowMat);

  // Place arrow above the target cell
  arrow.position.set(targetPos.x, 1.5, targetPos.z);
  arrow.rotation.x = Math.PI / 2; // point forward

  scene.add(arrow);
  hintArrow = arrow;
  hintArrowTarget = targetCellIdx;
  hintActive = true;
}

// --- Create Hole ---
function createHole(x, z, isDiamond) {
  const holeGroup = new THREE.Group();

  const holeGeo = new THREE.CylinderGeometry(0.5, 0.4, 0.4, 16);
  const hole = new THREE.Mesh(holeGeo, deepDirtMat);
  hole.position.y = -0.2;
  hole.receiveShadow = true;
  holeGroup.add(hole);

  const ringGeo = new THREE.TorusGeometry(0.55, 0.15, 8, 16);
  const ring = new THREE.Mesh(ringGeo, dirtMat);
  ring.rotation.x = Math.PI / 2;
  ring.position.y = 0.05;
  ring.castShadow = true;
  holeGroup.add(ring);

  let diamondGroup = null;
  if (isDiamond) {
    diamondGroup = createDiamond(x, 0.5, z);
    diamondGroup.visible = true;
  }

  holeGroup.position.set(x, 0, z);
  holeGroup.userData = { diamondGroup };
  scene.add(holeGroup);
  holeMeshes.push(holeGroup);
  return holeGroup;
}

// --- Dig Animation ---
function digAt(x, z) {
  if (!gameStarted) return;
  if (dugCells.has(x + ',' + z)) return;
  if (digsRemaining <= 0) return;

  digsMade++;
  digsRemaining--;
  dugCells.add(x + ',' + z);

  const cellIdx = Math.round((x / CELL_SIZE + (GRID_SIZE - 1) / 2)) +
                  Math.round((z / CELL_SIZE + (GRID_SIZE - 1) / 2)) * GRID_SIZE;
  const isDiamond = grid[cellIdx] === 1;

  createHole(x, z, isDiamond);
  createDigParticles(x, z, isDiamond);
  showMessage(isDiamond);

  if (isDiamond) {
    diamondsFound++;
    score += 100;
  } else {
    score = Math.max(0, score - 10);
  }
  updateUI();
  shakeCamera(0.3);

  // Check game end
  if (diamondsFound >= DIAMOND_COUNT) {
    setTimeout(() => endGame('win'), 1000);
  } else if (digsRemaining <= 0) {
    setTimeout(() => endGame('outofdigs'), 1000);
  }
}

// --- Timer ---
function startTimer() {
  timeRemaining = GAME_TIME;
  timeElapsed = 0;
  updateTimerUI();

  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (!gameStarted) return;
    timeRemaining--;
    timeElapsed++;
    updateTimerUI();

    if (timeRemaining <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      endGame('timeout');
    }
  }, 1000);
}

function stopTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

function updateTimerUI() {
  const display = document.getElementById('timer-display');
  const bar = document.getElementById('timer-bar');
  const warning = document.getElementById('timer-warning');

  display.textContent = timeRemaining;

  const pct = (timeRemaining / GAME_TIME) * 100;
  bar.style.width = pct + '%';

  if (timeRemaining <= 15) {
    bar.classList.add('urgent');
    warning.classList.add('show');
  } else {
    bar.classList.remove('urgent');
    warning.classList.remove('show');
  }
}

function showMessage(isDiamond) {
  const msg = document.getElementById('message');
  if (isDiamond) {
    msg.textContent = '💎 DIAMOND FOUND!';
    msg.className = 'show';
  } else {
    msg.textContent = '💨 Nothing here...';
    msg.className = 'show miss';
  }
  setTimeout(() => { msg.className = ''; }, 1500);
}

function updateUI() {
  document.getElementById('diamond-count').textContent = diamondsFound;
  document.getElementById('digs-left').textContent = digsRemaining;
  document.getElementById('score').textContent = score;
  document.getElementById('hint-btn').disabled = score < HINT_COST;
}

// --- Camera Shake ---
let shakeAmount = 0;
function shakeCamera(amount) {
  shakeAmount = amount;
}

// --- Raycasting ---
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

// Convert world (x, z) to nearest grid cell index
function worldToCell(wx, wz) {
  const col = Math.round(wx / CELL_SIZE + (GRID_SIZE - 1) / 2);
  const row = Math.round(wz / CELL_SIZE + (GRID_SIZE - 1) / 2);
  return Math.max(0, Math.min(GRID_SIZE - 1, row)) * GRID_SIZE + Math.max(0, Math.min(GRID_SIZE - 1, col));
}

renderer.domElement.addEventListener('click', (e) => {
  if (!gameStarted) return;

  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObject(ground);

  if (intersects.length > 0) {
    const wx = intersects[0].point.x;
    const wz = intersects[0].point.z;
    const cellIdx = worldToCell(wx, wz);
    const cellPos = cellToPosition(cellIdx);
    digAt(cellPos.x, cellPos.z);
  }
});

// Hover — show proximity
renderer.domElement.addEventListener('mousemove', (e) => {
  if (!gameStarted) return;

  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObject(ground);

  const proxInfo = document.getElementById('proximity-info');

  if (intersects.length > 0) {
    const wx = intersects[0].point.x;
    const wz = intersects[0].point.z;
    const cellIdx = worldToCell(wx, wz);
    const dug = dugCells.has(cellIdx);

    if (dug) {
      renderer.domElement.style.cursor = 'default';
      proxInfo.className = '';
    } else {
      renderer.domElement.style.cursor = 'crosshair';

      // Show proximity info
      const dist = getDistanceToNearestDiamond(cellIdx);
      const { text, color } = proximityLabel(dist);
      proxInfo.innerHTML = `<span class="dist" style="color:${color}">${text}</span> — ${dist.toFixed(1)} cells away`;
      proxInfo.className = 'show';
    }
  } else {
    renderer.domElement.style.cursor = 'default';
    proxInfo.className = '';
  }
});

// --- Touch Support ---
function getTouchPos(e) {
  const touch = e.touches[0] || e.changedTouches[0];
  return { x: touch.clientX, y: touch.clientY };
}

function handleTouchDig(e) {
  if (!gameStarted) return;
  e.preventDefault();

  const pos = getTouchPos(e);
  mouse.x = (pos.x / window.innerWidth) * 2 - 1;
  mouse.y = -(pos.y / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObject(ground);

  if (intersects.length > 0) {
    const wx = intersects[0].point.x;
    const wz = intersects[0].point.z;
    const cellIdx = worldToCell(wx, wz);
    const cellPos = cellToPosition(cellIdx);
    digAt(cellPos.x, cellPos.z);
  }
}

function handleTouchHover(e) {
  if (!gameStarted) return;
  e.preventDefault();

  const pos = getTouchPos(e);
  mouse.x = (pos.x / window.innerWidth) * 2 - 1;
  mouse.y = -(pos.y / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObject(ground);

  const proxInfo = document.getElementById('proximity-info');

  if (intersects.length > 0) {
    const wx = intersects[0].point.x;
    const wz = intersects[0].point.z;
    const cellIdx = worldToCell(wx, wz);
    const dug = dugCells.has(cellIdx);

    if (dug) {
      proxInfo.className = '';
    } else {
      const dist = getDistanceToNearestDiamond(cellIdx);
      const { text, color } = proximityLabel(dist);
      proxInfo.innerHTML = `<span class="dist" style="color:${color}">${text}</span> — ${dist.toFixed(1)} cells away`;
      proxInfo.className = 'show';
    }
  } else {
    proxInfo.className = '';
  }
}

renderer.domElement.addEventListener('touchstart', handleTouchDig, { passive: false });
renderer.domElement.addEventListener('touchmove', handleTouchHover, { passive: false });

// Hint button touch support
document.getElementById('hint-btn').addEventListener('touchend', (e) => {
  e.preventDefault();
  e.stopPropagation();
  document.getElementById('hint-btn').click();
});

// --- Hint System ---
document.getElementById('hint-btn').addEventListener('click', () => {
  if (!gameStarted || score < HINT_COST) return;

  // Find nearest undug diamond
  let nearestIdx = -1;
  let nearestDist = Infinity;
  for (let i = 0; i < TOTAL_CELLS; i++) {
    if (grid[i] === 1 && !dugCells.has(i)) {
      const dist = getDistanceToNearestDiamond(i);
      // Use distance from camera center (0, 0) as proxy for relevance
      const pos = cellToPosition(i);
      const camDist = Math.sqrt(pos.x * pos.x + pos.z * pos.z);
      if (camDist < nearestDist) {
        nearestDist = camDist;
        nearestIdx = i;
      }
    }
  }

  if (nearestIdx >= 0) {
    score -= HINT_COST;
    updateUI();
    createHintArrow(nearestIdx);
    showMessageHint(nearestIdx);
  }
});

function showMessageHint(targetIdx) {
  const pos = cellToPosition(targetIdx);
  const msg = document.getElementById('message');
  const dir = pos.x >= 0 ? 'Right' : 'Left';
  const depth = pos.z >= 0 ? 'Forward' : 'Backward';
  msg.textContent = `🔮 Diamond is ${dir} and ${depth}!`;
  msg.className = 'show';
  msg.style.color = '#d4b0ff';
  msg.style.textShadow = '0 0 30px rgba(150,100,255,0.8)';
  setTimeout(() => {
    msg.className = '';
    msg.style.color = '';
    msg.style.textShadow = '';
  }, 2000);
}

// --- Stars Background ---
function createStars() {
  const count = 500;
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);

  for (let i = 0; i < count; i++) {
    positions[i * 3] = (Math.random() - 0.5) * 200;
    positions[i * 3 + 1] = Math.random() * 50 + 10;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 200;
  }

  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 0.3,
    transparent: true,
    opacity: 0.8,
    sizeAttenuation: true,
  });
  scene.add(new THREE.Points(geo, mat));
}
createStars();

// --- Animation Loop ---
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const time = clock.getElapsedTime();

  // Camera shake
  if (shakeAmount > 0) {
    camera.position.x += (Math.random() - 0.5) * shakeAmount;
    camera.position.y += (Math.random() - 0.5) * shakeAmount;
    shakeAmount *= 0.9;
    if (shakeAmount < 0.01) {
      shakeAmount = 0;
      camera.position.set(0, 18, 14);
    }
  }

  // Gentle camera sway
  camera.position.x = Math.sin(time * 0.1) * 0.5;
  camera.position.z = 14 + Math.cos(time * 0.15) * 0.3;
  camera.lookAt(0, 0, 0);

  // Animate diamond meshes
  holeMeshes.forEach(h => {
    if (h.userData.diamondGroup && h.userData.diamondGroup.visible) {
      const dg = h.userData.diamondGroup;
      dg.children[0].rotation.y += dt * 2;
      dg.children[0].position.y = Math.sin(time * 3) * 0.15;
      dg.children[1].scale.setScalar(1 + Math.sin(time * 4) * 0.2);
    }
  });

  // Animate hint arrow
  if (hintActive && hintArrow) {
    hintArrow.position.y = 1.5 + Math.sin(time * 3) * 0.3;
    hintArrow.material.opacity = 0.6 + Math.sin(time * 4) * 0.2;
  }

  // Animate particles
  for (let i = particleSystems.length - 1; i >= 0; i--) {
    const ps = particleSystems[i];
    ps.life -= ps.decay;
    ps.points.material.opacity = ps.life;

    const pos = ps.points.geometry.attributes.position.array;
    for (let j = 0; j < ps.velocities.length; j++) {
      pos[j * 3] += ps.velocities[j].x;
      pos[j * 3 + 1] += ps.velocities[j].y;
      pos[j * 3 + 2] += ps.velocities[j].z;
      ps.velocities[j].y -= 0.005;
    }
    ps.points.geometry.attributes.position.needsUpdate = true;

    if (ps.life <= 0) {
      scene.remove(ps.points);
      ps.points.geometry.dispose();
      ps.points.material.dispose();
      particleSystems.splice(i, 1);
    }
  }

  renderer.render(scene, camera);
}

// --- End Game ---
function endGame(reason) {
  gameStarted = false;
  stopTimer();

  const endScreen = document.getElementById('end-screen');
  const endTitle = document.getElementById('end-title');
  const endSub = document.getElementById('end-subtitle');

  document.getElementById('end-diamonds').textContent = diamondsFound;
  document.getElementById('end-score').textContent = score;
  const accuracy = digsMade > 0 ? Math.round((diamondsFound / digsMade) * 100) : 0;
  document.getElementById('end-accuracy').textContent = accuracy + '%';
  document.getElementById('end-time').textContent = timeRemaining + 's';

  if (reason === 'win') {
    endTitle.textContent = '🎉 You Won!';
    endSub.textContent = `All diamonds found with ${timeRemaining}s left!`;
  } else if (reason === 'timeout') {
    endTitle.textContent = '⏰ Time\'s Up!';
    endSub.textContent = `${DIAMOND_COUNT - diamondsFound} diamond${DIAMOND_COUNT - diamondsFound > 1 ? 's' : ''} remaining`;
  } else {
    endTitle.textContent = '💨 Out of Digs!';
    endSub.textContent = `${DIAMOND_COUNT - diamondsFound} diamond${DIAMOND_COUNT - diamondsFound > 1 ? 's' : ''} remaining`;
  }

  endScreen.classList.remove('hidden');
}

// --- Start Game ---
function startGame() {
  // Reset state
  diamondsFound = 0;
  digsMade = 0;
  digsRemaining = MAX_DIGS;
  score = 0;
  dugCells = new Set();
  holeMeshes.forEach(h => scene.remove(h));
  holeMeshes = [];
  particleSystems.forEach(ps => {
    scene.remove(ps.points);
    ps.points.geometry.dispose();
    ps.points.material.dispose();
  });
  particleSystems = [];
  if (hintArrow) { scene.remove(hintArrow); hintArrow = null; }
  hintActive = false;

  // Clear scene of old holes but keep ground, lights, stars
  const toRemove = [];
  scene.traverse(obj => {
    if (obj.userData && obj.userData.diamondGroup) toRemove.push(obj);
  });
  toRemove.forEach(obj => scene.remove(obj));

  initGrid();
  updateUI();
  gameStarted = true;
  startTimer();
}

document.getElementById('start-btn').addEventListener('click', () => {
  document.getElementById('start-screen').classList.add('hidden');
  startGame();
});
document.getElementById('start-btn').addEventListener('touchend', (e) => {
  e.preventDefault();
  document.getElementById('start-screen').classList.add('hidden');
  startGame();
});

document.getElementById('restart-btn').addEventListener('click', () => {
  document.getElementById('end-screen').classList.add('hidden');
  startGame();
});
document.getElementById('restart-btn').addEventListener('touchend', (e) => {
  e.preventDefault();
  document.getElementById('end-screen').classList.add('hidden');
  startGame();
});

// --- Resize ---
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- Start Loop ---
animate();
</script>
