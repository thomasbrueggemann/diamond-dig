<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond Dig</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #1a0a2e; font-family: 'Segoe UI', Tahoma, sans-serif; }
canvas { display: block; }

#ui {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 30px;
  z-index: 10;
}

.stat {
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,215,0,0.3);
  border-radius: 12px;
  padding: 10px 24px;
  color: #fff;
  text-align: center;
  min-width: 100px;
}

.stat .label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: rgba(255,255,255,0.6);
  margin-bottom: 4px;
}

.stat .value {
  font-size: 28px;
  font-weight: bold;
  color: #ffd700;
}

.stat .value.diamonds { color: #00e5ff; }

#message {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 48px;
  font-weight: bold;
  color: #ffd700;
  text-shadow: 0 0 30px rgba(255,215,0,0.8), 0 0 60px rgba(255,215,0,0.4);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
  z-index: 10;
}

#message.show { opacity: 1; }
#message.miss { color: #ff6b6b; text-shadow: 0 0 30px rgba(255,107,107,0.8); }

#instructions {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255,255,255,0.5);
  font-size: 14px;
  z-index: 10;
}

#start-screen {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(10,5,30,0.95);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
}

#start-screen h1 {
  font-size: 72px;
  color: #ffd700;
  text-shadow: 0 0 40px rgba(255,215,0,0.6);
  margin-bottom: 10px;
}

#start-screen .subtitle {
  font-size: 18px;
  color: rgba(255,255,255,0.5);
  margin-bottom: 40px;
}

#start-btn {
  background: linear-gradient(135deg, #ffd700, #ff8c00);
  border: none;
  border-radius: 50px;
  padding: 16px 60px;
  font-size: 22px;
  font-weight: bold;
  color: #1a0a2e;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 0 30px rgba(255,215,0,0.4);
}

#start-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 50px rgba(255,215,0,0.6);
}
</style>
</head>
<body>

<div id="ui">
  <div class="stat">
    <div class="label">Diamonds</div>
    <div class="value diamonds" id="diamond-count">0</div>
  </div>
  <div class="stat">
    <div class="label">Dug</div>
    <div class="value" id="dug-count">0</div>
  </div>
  <div class="stat">
    <div class="label">Score</div>
    <div class="value" id="score">0</div>
  </div>
</div>

<div id="message"></div>
<div id="instructions">Click on the ground to dig for diamonds!</div>

<div id="start-screen">
  <h1>💎 Diamond Dig</h1>
  <div class="subtitle">Dig deep and find the hidden diamonds</div>
  <button id="start-btn">Start Digging</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// --- Game State ---
const GRID_SIZE = 10;
const CELL_SIZE = 2;
const TOTAL_CELLS = GRID_SIZE * GRID_SIZE;
const DIAMOND_COUNT = 8;
const DIG_SPOTS = TOTAL_CELLS;

let diamondsFound = 0;
let digsMade = 0;
let score = 0;
let gameStarted = false;
let grid = []; // 0 = empty, 1 = diamond
let dugCells = new Set();
let holeMeshes = [];
let particleSystems = [];

// --- Three.js Setup ---
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x1a0a2e, 0.015);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 18, 14);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x1a0a2e);
document.body.appendChild(renderer.domElement);

// --- Lighting ---
const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffeedd, 1.0);
dirLight.position.set(10, 20, 10);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.camera.left = -15;
dirLight.shadow.camera.right = 15;
dirLight.shadow.camera.top = 15;
dirLight.shadow.camera.bottom = -15;
scene.add(dirLight);

const pointLight = new THREE.PointLight(0xffd700, 0.5, 30);
pointLight.position.set(0, 10, 0);
scene.add(pointLight);

// --- Materials ---
const grassMat = new THREE.MeshStandardMaterial({
  color: 0x2d5a1e,
  roughness: 0.9,
  metalness: 0.0,
});

const dirtMat = new THREE.MeshStandardMaterial({
  color: 0x5c3a1e,
  roughness: 1.0,
  metalness: 0.0,
});

const deepDirtMat = new THREE.MeshStandardMaterial({
  color: 0x3a2510,
  roughness: 1.0,
  metalness: 0.0,
});

// --- Ground Plane ---
const groundGeo = new THREE.PlaneGeometry(GRID_SIZE * CELL_SIZE + 2, GRID_SIZE * CELL_SIZE + 2);
const ground = new THREE.Mesh(groundGeo, grassMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.01;
ground.receiveShadow = true;
scene.add(ground);

// --- Grid Setup ---
function initGrid() {
  grid = new Array(TOTAL_CELLS).fill(0);
  let placed = 0;
  while (placed < DIAMOND_COUNT) {
    const idx = Math.floor(Math.random() * TOTAL_CELLS);
    if (grid[idx] === 0) {
      grid[idx] = 1;
      placed++;
    }
  }
  console.log('Diamonds placed at:', grid.map((v, i) => v === 1 ? i : -1).filter(i => i >= 0));
}

function cellToPosition(cellIdx) {
  const row = Math.floor(cellIdx / GRID_SIZE);
  const col = cellIdx % GRID_SIZE;
  const x = (col - (GRID_SIZE - 1) / 2) * CELL_SIZE;
  const z = (row - (GRID_SIZE - 1) / 2) * CELL_SIZE;
  return { x, z };
}

// --- Diamond Mesh ---
function createDiamond(x, y, z) {
  const group = new THREE.Group();

  // Diamond shape using octahedron
  const geo = new THREE.OctahedronGeometry(0.3, 0);
  const mat = new THREE.MeshStandardMaterial({
    color: 0x00e5ff,
    emissive: 0x004466,
    emissiveIntensity: 0.5,
    roughness: 0.1,
    metalness: 0.3,
    transparent: true,
    opacity: 0.9,
  });
  const diamond = new THREE.Mesh(geo, mat);
  diamond.castShadow = true;
  group.add(diamond);

  // Glow
  const glowGeo = new THREE.SphereGeometry(0.5, 16, 16);
  const glowMat = new THREE.MeshBasicMaterial({
    color: 0x00e5ff,
    transparent: true,
    opacity: 0.15,
  });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  group.add(glow);

  // Point light for the diamond
  const light = new THREE.PointLight(0x00e5ff, 1, 5);
  group.add(light);

  group.position.set(x, y, z);
  group.visible = false;
  scene.add(group);
  return group;
}

// --- Particles ---
function createDigParticles(x, z, isDiamond) {
  const count = isDiamond ? 40 : 20;
  const color = isDiamond ? 0x00e5ff : 0x5c3a1e;
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  const velocities = [];

  for (let i = 0; i < count; i++) {
    positions[i * 3] = x;
    positions[i * 3 + 1] = 0.2;
    positions[i * 3 + 2] = z;
    velocities.push({
      x: (Math.random() - 0.5) * 0.3,
      y: Math.random() * 0.2 + 0.1,
      z: (Math.random() - 0.5) * 0.3,
    });
  }

  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

  const mat = new THREE.PointsMaterial({
    color: color,
    size: 0.15,
    transparent: true,
    opacity: 1,
    sizeAttenuation: true,
  });

  const points = new THREE.Points(geo, mat);
  scene.add(points);

  particleSystems.push({
    points,
    velocities,
    life: 1.0,
    decay: 0.02,
  });
}

// --- Create Hole ---
function createHole(x, z, isDiamond) {
  const holeGroup = new THREE.Group();

  // Dark hole
  const holeGeo = new THREE.CylinderGeometry(0.5, 0.4, 0.4, 16);
  const hole = new THREE.Mesh(holeGeo, deepDirtMat);
  hole.position.y = -0.2;
  hole.receiveShadow = true;
  holeGroup.add(hole);

  // Dirt ring around hole
  const ringGeo = new THREE.TorusGeometry(0.55, 0.15, 8, 16);
  const ring = new THREE.Mesh(ringGeo, dirtMat);
  ring.rotation.x = Math.PI / 2;
  ring.position.y = 0.05;
  ring.castShadow = true;
  holeGroup.add(ring);

  // If diamond, add the diamond mesh
  let diamondGroup = null;
  if (isDiamond) {
    diamondGroup = createDiamond(x, 0.5, z);
    diamondGroup.visible = true;
  }

  holeGroup.position.set(x, 0, z);
  holeGroup.userData = { diamondGroup };
  scene.add(holeGroup);
  holeMeshes.push(holeGroup);
  return holeGroup;
}

// --- Dig Animation ---
function digAt(x, z) {
  if (!gameStarted) return;
  if (dugCells.has(x + ',' + z)) return;

  digsMade++;
  dugCells.add(x + ',' + z);

  const cellIdx = Math.round((x / CELL_SIZE + (GRID_SIZE - 1) / 2)) +
                  Math.round((z / CELL_SIZE + (GRID_SIZE - 1) / 2)) * GRID_SIZE;
  const isDiamond = grid[cellIdx] === 1;

  // Create hole
  createHole(x, z, isDiamond);

  // Create particles
  createDigParticles(x, z, isDiamond);

  // Show message
  showMessage(isDiamond);

  // Update UI
  if (isDiamond) {
    diamondsFound++;
    score += 100;
  } else {
    score = Math.max(0, score - 10);
  }
  updateUI();

  // Camera shake
  shakeCamera(0.3);
}

function showMessage(isDiamond) {
  const msg = document.getElementById('message');
  if (isDiamond) {
    msg.textContent = '💎 DIAMOND FOUND!';
    msg.className = 'show';
  } else {
    msg.textContent = '💨 Nothing here...';
    msg.className = 'show miss';
  }
  setTimeout(() => { msg.className = ''; }, 1500);
}

function updateUI() {
  document.getElementById('diamond-count').textContent = diamondsFound;
  document.getElementById('dug-count').textContent = digsMade;
  document.getElementById('score').textContent = score;
}

// --- Camera Shake ---
let shakeAmount = 0;
function shakeCamera(amount) {
  shakeAmount = amount;
}

// --- Raycasting ---
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

// Create invisible dig targets for each cell
const digTargets = [];
for (let i = 0; i < TOTAL_CELLS; i++) {
  const pos = cellToPosition(i);
  const geo = new THREE.CircleGeometry(0.6, 16);
  const mat = new THREE.MeshBasicMaterial({
    visible: false,
    side: THREE.DoubleSide,
  });
  const target = new THREE.Mesh(geo, mat);
  target.rotation.x = -Math.PI / 2;
  target.position.set(pos.x, 0.01, pos.z);
  target.userData = { cellIdx: i };
  scene.add(target);
  digTargets.push(target);
}

renderer.domElement.addEventListener('click', (e) => {
  if (!gameStarted) return;

  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(digTargets);

  if (intersects.length > 0) {
    const cellIdx = intersects[0].object.userData.cellIdx;
    const pos = cellToPosition(cellIdx);
    digAt(pos.x, pos.z);
  }
});

// Hover cursor change
renderer.domElement.addEventListener('mousemove', (e) => {
  if (!gameStarted) return;

  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(digTargets);

  if (intersects.length > 0) {
    const cellIdx = intersects[0].object.userData.cellIdx;
    const key = cellIdx;
    renderer.domElement.style.cursor = dugCells.has(cellIdx) ? 'default' : 'crosshair';
  } else {
    renderer.domElement.style.cursor = 'default';
  }
});

// --- Stars Background ---
function createStars() {
  const count = 500;
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);

  for (let i = 0; i < count; i++) {
    positions[i * 3] = (Math.random() - 0.5) * 200;
    positions[i * 3 + 1] = Math.random() * 50 + 10;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 200;
  }

  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 0.3,
    transparent: true,
    opacity: 0.8,
    sizeAttenuation: true,
  });
  scene.add(new THREE.Points(geo, mat));
}
createStars();

// --- Animation Loop ---
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const time = clock.getElapsedTime();

  // Camera shake
  if (shakeAmount > 0) {
    camera.position.x += (Math.random() - 0.5) * shakeAmount;
    camera.position.y += (Math.random() - 0.5) * shakeAmount;
    shakeAmount *= 0.9;
    if (shakeAmount < 0.01) {
      shakeAmount = 0;
      camera.position.set(0, 18, 14);
    }
  }

  // Gentle camera sway
  camera.position.x = Math.sin(time * 0.1) * 0.5;
  camera.position.z = 14 + Math.cos(time * 0.15) * 0.3;
  camera.lookAt(0, 0, 0);

  // Animate diamond meshes
  holeMeshes.forEach(h => {
    if (h.userData.diamondGroup && h.userData.diamondGroup.visible) {
      const dg = h.userData.diamondGroup;
      dg.children[0].rotation.y += dt * 2;
      dg.children[0].position.y = Math.sin(time * 3) * 0.15;
      dg.children[1].scale.setScalar(1 + Math.sin(time * 4) * 0.2);
    }
  });

  // Animate particles
  for (let i = particleSystems.length - 1; i >= 0; i--) {
    const ps = particleSystems[i];
    ps.life -= ps.decay;
    ps.points.material.opacity = ps.life;

    const pos = ps.points.geometry.attributes.position.array;
    for (let j = 0; j < ps.velocities.length; j++) {
      pos[j * 3] += ps.velocities[j].x;
      pos[j * 3 + 1] += ps.velocities[j].y;
      pos[j * 3 + 2] += ps.velocities[j].z;
      ps.velocities[j].y -= 0.005; // gravity
    }
    ps.points.geometry.attributes.position.needsUpdate = true;

    if (ps.life <= 0) {
      scene.remove(ps.points);
      ps.points.geometry.dispose();
      ps.points.material.dispose();
      particleSystems.splice(i, 1);
    }
  }

  renderer.render(scene, camera);
}

// --- Start Game ---
document.getElementById('start-btn').addEventListener('click', () => {
  document.getElementById('start-screen').style.display = 'none';
  gameStarted = true;
  initGrid();
});

// --- Resize ---
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- Start Loop ---
animate();
</script>
</body>
</html>
